site_name: AFMSlicer
site_url: https://AFMSlicer.readthedocs.org/
repo_url: https://github.com/AFM-SPM/AFMSlicer/
theme:
  name: material
  palette:
    # Palette toggle for automatic mode
    - media: (prefers-color-scheme)
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
nav:
  - Home: index.md
  - Introduction: introduction.md
  - Installation: installation.md
  - Usage:
      - Overview: usage/index.md
      - CLI: usage/cli.md
      - Configuration: usage/configuration.md
      - Napari: usage/napari.md
  - Workflow: workflow.md
  - Contributing:
      - Overview: contributing/index.md
      - Adding Modules: contributing/adding_modules.md
      - Napari: contributing/napari.md
  - API:
      - API: api/index.md
      - entry_point: api/entry_point.md
      - filter: api/filter.md
      - io: api/io.md
      - logging: api/logging.md
      - plotting: api/plotting.md
      - processing: api/processing.md
      - run_modules: api/run_modules.md
      - slicer: api/slicer.md
      - statistics: api/statistics.md
      - validation: api/validation.md

extra:
  version:
    provider: mike

plugins:
  - mkdocstrings:
      handlers:
        python:
          inventories:
            - https://docs.python.org/3/objects.inv
          paths: [src]
          options:
            docstring_style: numpy
            docstring_section_style: table
            filters: ["!^_"]
            heading_level: 1
            inherited_members: true
            parameter_headings: true
            separate_signature: true
            show_if_no_docstring: false
            show_root_full_path: false
            show_root_heading: false
            show_signature_annotations: false
            show_source: false
            signature_crossrefs: true
            summary: true
            type_parameter_headings: true
  - autorefs
  - mermaid2
  - search

markdown_extensions:
  - admonition
  - pymdownx.blocks.tab
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
  - pymdownx.tabbed:
      alternate_style: true
